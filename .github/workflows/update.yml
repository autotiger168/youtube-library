name: 自動更新影片

on:
  schedule:
    # 每兩天一次，台灣時間早上 06:00（UTC 22:00）
    - cron: "0 22 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取影片
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch.py

      - name: 儲存結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/channels_cache.json
          if git diff --cached --quiet; then
            echo "沒有變更"
            exit 0
          fi
          git commit -m "自動更新影片 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
